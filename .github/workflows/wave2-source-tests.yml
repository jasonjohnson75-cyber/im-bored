name: Wave 2 Source Tests
on:
  pull_request:
    paths:
      - 'source-engine/**'
      - '.github/workflows/wave2-source-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx vitest run source-engine/tests/jsonLdEvents.test.ts source-engine/tests/wave2LiveDryRun.test.ts
