name: Source Engine Live Dry Run

on:
  workflow_dispatch:
  push:
    paths:
      - 'source-engine/tests/liveDryRun.test.ts'
      - 'source-engine/adapters/**'
      - 'source-engine/extractors/**'
      - 'package.json'
      - '.github/workflows/source-engine-live-dry-run.yml'

jobs:
  live-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run test:live-dry-run
