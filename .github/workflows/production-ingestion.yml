name: Production Source Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    paths:
      - 'source-engine/**'
      - 'package.json'
      - '.github/workflows/production-ingestion.yml'

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://vtvxzdvsnjhdkgtgzdxw.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Run production ingestion
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npm run ingest:production
      - name: Explain skipped ingestion
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: echo 'SUPABASE_SERVICE_ROLE_KEY is not configured; ingestion skipped safely.'
