name: Production Source Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Run production ingestion
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: https://vtvxzdvsnjhdkgtgzdxw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run ingest:production
      - name: Explain skipped ingestion
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: echo 'SUPABASE_SERVICE_ROLE_KEY is not configured; ingestion skipped safely.'
